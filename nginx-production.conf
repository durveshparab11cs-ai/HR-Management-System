# Nginx Production Configuration for Smart HRMS
# Location: C:\nginx-1.27.0\conf\nginx.conf
# Replace your existing nginx.conf with this file

user nginx;
worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream Flask server
    upstream flask_app {
        server 127.0.0.1:5000;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name smarthrms.tech www.smarthrms.tech;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root C:/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name smarthrms.tech www.smarthrms.tech;

        # SSL Certificate paths (replace with your domain)
        ssl_certificate C:/Certbot/live/smarthrms.tech/cert.pem;
        ssl_certificate_key C:/Certbot/live/smarthrms.tech/privkey.pem;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;

        # Logging
        access_log logs/access.log main;
        error_log logs/error.log warn;

        # Root location
        root C:/Users/durve/Downloads/HR\ management\ system;

        # Flask proxy
        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_redirect off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        # Static files (if any)
        location /static/ {
            alias C:/Users/durve/Downloads/HR\ management\ system/app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media/uploads
        location /instance/ {
            alias C:/Users/durve/Downloads/HR\ management\ system/instance/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Deny access to sensitive files
        location ~ /\.env {
            deny all;
        }
        location ~ /\.git {
            deny all;
        }
    }

    # Redirect www to non-www (optional)
    server {
        listen 443 ssl http2;
        server_name www.smarthrms.tech;
        ssl_certificate C:/Certbot/live/smarthrms.tech/cert.pem;
        ssl_certificate_key C:/Certbot/live/smarthrms.tech/privkey.pem;
        return 301 https://smarthrms.tech$request_uri;
    }
}
