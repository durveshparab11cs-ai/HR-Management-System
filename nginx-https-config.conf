# ============================================================================
# Smart HRMS Nginx Configuration — HTTPS Reverse Proxy
# Internal Corporate Deployment (Self-Signed Certificate)
# Windows Server Deployment
# ============================================================================
# Installation:
# 1. Download Nginx from http://nginx.org/en/download.html
# 2. Extract to C:\Smart_HRMS\nginx
# 3. Replace conf/nginx.conf with this file
# 4. Update certificate paths if needed (lines 29-30)
# 5. Run: cd C:\Smart_HRMS\nginx && nginx.exe
# ============================================================================

user nobody;
worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ========================================================================
    # HTTPS Server — Smart HRMS Reverse Proxy
    # ========================================================================
    server {
        listen 443 ssl http2;
        server_name 192.168.0.5;

        # ====== CRITICAL: Update these paths to your certificate location ======
        ssl_certificate C:/Smart_HRMS/certs/smart-hrms.crt;
        ssl_certificate_key C:/Smart_HRMS/certs/smart-hrms.key;
        # =========================================================================

        # SSL Protocol Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Access Logs
        access_log logs/https_access.log main;
        error_log logs/https_error.log warn;

        # ====================================================================
        # Root Reverse Proxy to Flask Application (port 3001)
        # ====================================================================
        location / {
            proxy_pass http://127.0.0.1:3001;
            
            # ── Essential Proxy Headers ────────────────────────────────────
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            # ── Session & Cookie Handling ──────────────────────────────────
            proxy_cookie_path / "/";
            # Important: Don't override cookies, let Flask set them
            # proxy_cookie_flags ~ secure httponly;

            # ── Connection Handling ────────────────────────────────────────
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;

            # ── Timeout Configuration (for long GPS/camera operations) ─────
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # ── WebSocket Support (if needed for real-time features) ───────
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ====================================================================
        # Health Check Endpoint (optional, for monitoring)
        # ====================================================================
        location /health {
            proxy_pass http://127.0.0.1:3001/health;
            proxy_http_version 1.1;
            access_log off;
        }

        # ====================================================================
        # Security Headers (CRITICAL: allow geolocation & camera!)
        # ====================================================================
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # !! CRITICAL: Allow geolocation and camera !!
        # Without Permissions-Policy allowing these, navigator.geolocation
        # and navigator.mediaDevices will be blocked in modern browsers.
        # We ONLY restrict microphone (not used by Smart HRMS).
        add_header Permissions-Policy "microphone=()" always;

        # Strict-Transport-Security (enforce HTTPS on return visits)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy (adjust as needed for your domain)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https: blob:; frame-src 'self';" always;
    }

    # ========================================================================
    # HTTP Server — Redirect to HTTPS (security best practice)
    # ========================================================================
    server {
        listen 80;
        server_name 192.168.0.5;
        
        # Redirect all HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }
}
