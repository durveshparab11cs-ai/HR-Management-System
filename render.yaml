services:
  - type: web
    name: SMART-HRMS-ERP
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SCHEDULER_TIMEZONE
        value: Asia/Kolkata
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-hrms-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: smart-hrms-postgres
    databaseName: smart_hrms_db
    user: hrms_user
    plan: free
    region: singapore
