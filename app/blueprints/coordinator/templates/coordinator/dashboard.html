<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Kiosk - HR Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .kiosk-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        .kiosk-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .kiosk-header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .kiosk-header p {
            font-size: 14px;
            color: #666;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .step.active .step-number {
            background: #667eea;
            color: white;
            transform: scale(1.2);
        }

        .step.completed .step-number {
            background: #4caf50;
            color: white;
        }

        .step-label {
            font-size: 11px;
            text-align: center;
            color: #666;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 10px;
        }

        .employee-card {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .employee-card:hover {
            background-color: #f5f5f5;
        }

        .employee-card.selected {
            background-color: #e3f2fd;
            border-left: 4px solid #667eea;
        }

        .employee-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .info-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        .info-item label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .camera-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        canvas {
            display: none;
        }

        .photo-preview {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .confirmation {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .confirmation h3 {
            color: #ff6f00;
            margin-bottom: 10px;
        }

        .reset-link {
            text-align: center;
            margin-top: 20px;
        }

        .reset-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .reset-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #f44336;
            font-size: 14px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .kiosk-container {
                padding: 20px;
            }

            .kiosk-header h1 {
                font-size: 24px;
            }

            .step-label {
                font-size: 9px;
            }

            .employee-info {
                grid-template-columns: 1fr;
            }

            button {
                min-width: 100px;
                padding: 10px 15px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="kiosk-container">
        <div class="kiosk-header">
            <h1>🏢 Attendance Kiosk</h1>
            <p>Employee Check-In / Check-Out System</p>
        </div>

        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step active" data-step="1">
                <div class="step-number">1</div>
                <div class="step-label">Enter Code</div>
            </div>
            <div class="step" data-step="2">
                <div class="step-number">2</div>
                <div class="step-label">Search</div>
            </div>
            <div class="step" data-step="3">
                <div class="step-number">3</div>
                <div class="step-label">View Info</div>
            </div>
            <div class="step" data-step="4">
                <div class="step-number">4</div>
                <div class="step-label">Camera</div>
            </div>
            <div class="step" data-step="5">
                <div class="step-number">5</div>
                <div class="step-label">Capture</div>
            </div>
            <div class="step" data-step="6">
                <div class="step-number">6</div>
                <div class="step-label">Confirm</div>
            </div>
        </div>

        <!-- Step 1: Enter Employee Code -->
        <div class="content-section active" data-content="1">
            <div class="form-group">
                <label>📱 Enter Employee Code</label>
                <input type="text" id="employeeCode" placeholder="e.g., E-2603028 or E-2603" autofocus>
                <div class="error-message" id="codeError"></div>
            </div>
            <button class="btn-primary" onclick="goToStep(2)">Next →</button>
        </div>

        <!-- Step 2: Search Results -->
        <div class="content-section" data-content="2">
            <div class="form-group">
                <label>🔍 Search Results</label>
                <div class="loading" id="searchLoading">
                    <div class="spinner"></div>
                    <p>Searching...</p>
                </div>
                <div class="search-results" id="searchResults"></div>
                <div class="error-message" id="searchError"></div>
            </div>
            <div class="button-group">
                <button class="btn-secondary" onclick="goToStep(1)">← Back</button>
                <button class="btn-primary" id="nextFromSearch" onclick="goToStep(3)" style="display:none;">Next →</button>
            </div>
        </div>

        <!-- Step 3: Employee Information Display -->
        <div class="content-section" data-content="3">
            <div class="form-group">
                <label>👤 Employee Information</label>
                <div id="employeeDetails" class="employee-info"></div>
            </div>
            <div class="button-group">
                <button class="btn-secondary" onclick="goToStep(2)">← Back</button>
                <button class="btn-primary" onclick="goToStep(4)">Next →</button>
            </div>
        </div>

        <!-- Step 4: Open Camera -->
        <div class="content-section" data-content="4">
            <div class="form-group">
                <label>📷 Camera</label>
                <div class="camera-container">
                    <video id="cameraFeed" autoplay playsinline></video>
                </div>
            </div>
            <div class="button-group">
                <button class="btn-secondary" onclick="goToStep(3)">← Back</button>
                <button class="btn-primary" onclick="goToStep(5)">Capture Photo →</button>
            </div>
        </div>

        <!-- Step 5: Capture & Preview Photo -->
        <div class="content-section" data-content="5">
            <div class="form-group">
                <label>📸 Photo Preview</label>
                <canvas id="photoCanvas" style="display:none;"></canvas>
                <img id="photoPreview" class="photo-preview" style="display:none;">
            </div>
            <div class="button-group">
                <button class="btn-secondary" onclick="recapturePhoto()">Retake ↻</button>
                <button class="btn-primary" onclick="goToStep(6)">Use This Photo →</button>
            </div>
        </div>

        <!-- Step 6: Check-In / Check-Out -->
        <div class="content-section" data-content="6">
            <div class="confirmation">
                <h3>Ready to Confirm Attendance</h3>
                <p id="attendanceConfirmation"></p>
            </div>
            <div class="message" id="attendanceMessage"></div>
            <div class="loading" id="attendanceLoading">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>
            <div class="button-group">
                <button class="btn-secondary" onclick="resetKiosk()">New Employee</button>
                <button class="btn-success" onclick="submitAttendance('checkin')">✅ Check-In</button>
                <button class="btn-danger" onclick="submitAttendance('checkout')">🚪 Check-Out</button>
            </div>
            <div class="reset-link">
                <a href="javascript:resetKiosk()">← Start Over</a>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let currentStep = 1;
        let selectedEmployee = null;
        let capturedPhoto = null;

        const API_BASE = window.location.origin;

        // Step Navigation
        function goToStep(step) {
            // Validate current step before moving forward
            if (step > currentStep) {
                if (!validateStep(currentStep)) return;
                
                if (step === 2) {
                    searchEmployee();
                    return;
                }
            }

            currentStep = step;
            updateUI();
        }

        function validateStep(step) {
            const code = document.getElementById('employeeCode').value.trim();
            
            if (step === 1 && !code) {
                document.getElementById('codeError').textContent = '❌ Please enter employee code';
                return false;
            }
            
            document.getElementById('codeError').textContent = '';
            return true;
        }

        function updateUI() {
            // Update content sections
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelector(`.content-section[data-content="${currentStep}"]`).classList.add('active');

            // Update step indicators
            document.querySelectorAll('.step').forEach(step => {
                const stepNum = parseInt(step.dataset.step);
                step.classList.remove('active', 'completed');
                
                if (stepNum === currentStep) {
                    step.classList.add('active');
                } else if (stepNum < currentStep) {
                    step.classList.add('completed');
                }
            });

            // Special handling for each step
            if (currentStep === 4) {
                startCamera();
            } else if (currentStep === 5) {
                capturePhotoFromCamera();
            }
        }

        // Step 1-2: Search Employee
        async function searchEmployee() {
            const code = document.getElementById('employeeCode').value.trim().toUpperCase();
            
            if (!code || code.length < 2) {
                document.getElementById('searchError').textContent = '❌ Enter at least 2 characters';
                return;
            }

            const searchLoading = document.getElementById('searchLoading');
            const searchResults = document.getElementById('searchResults');
            const searchError = document.getElementById('searchError');

            searchLoading.classList.add('active');
            searchResults.innerHTML = '';
            searchError.textContent = '';

            try {
                const response = await fetch(`${API_BASE}/coordinator/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: code })
                });

                const data = await response.json();
                searchLoading.classList.remove('active');

                if (!data.success || !data.results || data.results.length === 0) {
                    searchError.textContent = `❌ No employee found for "${code}"`;
                    return;
                }

                // Display results
                data.results.forEach(emp => {
                    const card = document.createElement('div');
                    card.className = 'employee-card';
                    card.innerHTML = `
                        <strong>${emp.code}</strong> — ${emp.name}<br>
                        <small>${emp.department} | ${emp.branch}</small>
                    `;
                    card.onclick = () => selectEmployee(emp, card);
                    searchResults.appendChild(card);
                });

                // Auto-select if only one result
                if (data.results.length === 1) {
                    selectEmployee(data.results[0], searchResults.querySelector('.employee-card'));
                }
            } catch (error) {
                searchLoading.classList.remove('active');
                searchError.textContent = `❌ Search failed: ${error.message}`;
            }
        }

        function selectEmployee(emp, cardElement) {
            selectedEmployee = emp;

            // Update UI
            document.querySelectorAll('.employee-card').forEach(card => {
                card.classList.remove('selected');
            });
            cardElement.classList.add('selected');

            document.getElementById('nextFromSearch').style.display = 'block';

            // Display info
            displayEmployeeInfo(emp);
        }

        function displayEmployeeInfo(emp) {
            const details = document.getElementById('employeeDetails');
            details.innerHTML = `
                <div class="info-item">
                    <label>Employee Code</label>
                    <div class="value">${emp.code}</div>
                </div>
                <div class="info-item">
                    <label>Full Name</label>
                    <div class="value">${emp.name}</div>
                </div>
                <div class="info-item">
                    <label>Department</label>
                    <div class="value">${emp.department}</div>
                </div>
                <div class="info-item">
                    <label>Branch/Location</label>
                    <div class="value">${emp.branch}</div>
                </div>
            `;
        }

        // Step 4: Camera
        async function startCamera() {
            try {
                const video = document.getElementById('cameraFeed');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' }
                });
                video.srcObject = stream;
            } catch (error) {
                alert(`Camera error: ${error.message}`);
                goToStep(3);
            }
        }

        function capturePhotoFromCamera() {
            const video = document.getElementById('cameraFeed');
            const canvas = document.getElementById('photoCanvas');
            const ctx = canvas.getContext('2d');

            // Set canvas size to match video
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;

            // Draw and capture
            ctx.drawImage(video, 0, 0);
            capturedPhoto = canvas.toDataURL('image/jpeg');

            // Show preview
            const preview = document.getElementById('photoPreview');
            preview.src = capturedPhoto;
            preview.style.display = 'block';

            // Stop camera
            const stream = video.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }

        function recapturePhoto() {
            document.getElementById('photoPreview').style.display = 'none';
            capturedPhoto = null;
            goToStep(4);
        }

        // Step 6: Submit Attendance
        async function submitAttendance(action) {
            if (!selectedEmployee) {
                alert('Please select an employee first');
                return;
            }

            const attendanceLoading = document.getElementById('attendanceLoading');
            const attendanceMessage = document.getElementById('attendanceMessage');

            attendanceLoading.classList.add('active');
            attendanceMessage.innerHTML = '';
            attendanceMessage.className = 'message';

            try {
                const endpoint = action === 'checkin' ? '/coordinator/kiosk_checkin' : '/coordinator/kiosk_checkout';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employee_id: selectedEmployee.id,
                        proof_photo: capturedPhoto
                    })
                });

                const data = await response.json();
                attendanceLoading.classList.remove('active');

                if (data.success) {
                    attendanceMessage.textContent = data.message;
                    attendanceMessage.className = 'message success';
                    setTimeout(() => resetKiosk(), 3000);
                } else {
                    attendanceMessage.textContent = `❌ ${data.message}`;
                    attendanceMessage.className = 'message error';
                }
            } catch (error) {
                attendanceLoading.classList.remove('active');
                attendanceMessage.textContent = `❌ Error: ${error.message}`;
                attendanceMessage.className = 'message error';
            }
        }

        function resetKiosk() {
            currentStep = 1;
            selectedEmployee = null;
            capturedPhoto = null;

            document.getElementById('employeeCode').value = '';
            document.getElementById('employeeCode').focus();
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('nextFromSearch').style.display = 'none';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('searchError').textContent = '';
            document.getElementById('codeError').textContent = '';

            updateUI();
        }

        // Initialize
        document.getElementById('employeeCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') goToStep(2);
        });

        updateUI();
    </script>
</body>
</html>
