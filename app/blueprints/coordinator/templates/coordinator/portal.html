<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Check-In/Out</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #4caf50;
            --danger: #f44336;
            --dark: #2c3e50;
            --light: #f5f7fa;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .header h1 {
            font-size: 32px;
            color: var(--dark);
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 14px;
            color: #999;
            letter-spacing: 0.5px;
        }
        
        /* STEP 1: Code Input */
        .code-input-section {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        
        .code-input-section.hidden {
            display: none;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 12px;
            font-size: 16px;
            letter-spacing: 0.3px;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 20px;
            color: var(--primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }
        
        .form-group input::placeholder {
            color: #bbb;
            text-transform: uppercase;
        }
        
        /* Employee Info Display */
        .employee-info {
            background: linear-gradient(135deg, #f5f7ff 0%, #f9f5ff 100%);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 2px solid rgba(102, 126, 234, 0.1);
            display: none;
            animation: slideIn 0.4s ease;
        }
        
        .employee-info.show {
            display: block;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .emp-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
        }
        
        .emp-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-right: 16px;
            font-weight: 700;
        }
        
        .emp-name {
            display: flex;
            flex-direction: column;
        }
        
        .emp-name .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .emp-name .code {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .emp-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .detail-item label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }
        
        .detail-item .value {
            font-size: 14px;
            color: var(--dark);
            font-weight: 700;
        }
        
        /* Camera Section */
        .camera-section {
            display: none;
            text-align: center;
        }
        
        .camera-section.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .camera-label {
            font-size: 14px;
            color: #999;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        video {
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #000;
            margin-bottom: 24px;
            border: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        
        canvas {
            display: none;
        }
        
        .photo-preview {
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 3px solid var(--success);
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.2);
            animation: zoomIn 0.4s ease;
        }
        
        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-primary:hover {
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--success), #45a049);
            color: white;
            flex: 1;
        }
        
        .btn-success:hover {
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #da190b);
            color: white;
            flex: 1;
        }
        
        .btn-danger:hover {
            box-shadow: 0 10px 30px rgba(244, 67, 54, 0.4);
        }
        
        .btn-reset {
            background: #f0f0f0;
            color: var(--dark);
            border: 2px solid #ddd;
            width: 100%;
            margin-top: 16px;
        }
        
        .btn-reset:hover {
            background: #e8e8e8;
            border-color: var(--primary);
        }
        
        .message {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: none;
            font-size: 14px;
            font-weight: 600;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border-left-color: var(--success);
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border-left-color: var(--danger);
        }
        
        .loading {
            text-align: center;
            display: none;
            padding: 30px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading p {
            color: var(--primary);
            font-weight: 600;
        }
        
        .full-width {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🏢</div>
            <h1>Quick Check-In</h1>
            <p>Enter employee code to start</p>
        </div>
        
        <!-- Messages -->
        <div class="message" id="msgBox"></div>
        <div class="loading" id="loadingBox">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
        
        <!-- STEP 1: Code Input -->
        <div class="code-input-section" id="codeSection">
            <div class="form-group">
                <label for="empCode">👤 Employee Code</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input
                        type="text"
                        id="empCode"
                        placeholder="e.g., E-2606026"
                        autocomplete="off"
                        autofocus
                    >
                </div>
            </div>
        </div>
        
        <!-- Employee Info Display -->
        <div class="employee-info" id="empInfo">
            <div class="emp-header">
                <div class="emp-avatar" id="empAvatar">👤</div>
                <div class="emp-name">
                    <span class="name" id="empName">-</span>
                    <span class="code" id="empCode2">-</span>
                </div>
            </div>
            <div class="emp-details">
                <div class="detail-item">
                    <label>Department</label>
                    <div class="value" id="empDept">-</div>
                </div>
                <div class="detail-item">
                    <label>Designation</label>
                    <div class="value" id="empDesig">-</div>
                </div>
            </div>
        </div>
        
        <!-- STEP 2: Camera -->
        <div class="camera-section" id="cameraSection">
            <div class="camera-label">📷 Camera Ready - Click Capture</div>
            <video id="camera" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div id="photoDisplay" style="display:none;">
                <img id="photoImg" class="photo-preview">
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="button-group" id="actionButtons" style="display:none;">
            <button class="btn-success" onclick="submitAttendance('checkin')">✓ Check-In</button>
            <button class="btn-danger" onclick="submitAttendance('checkout')">✗ Check-Out</button>
        </div>
        
        <button class="btn-primary full-width" id="submitBtn" onclick="handleCodeSubmit()">📍 Submit Code</button>
        <button class="btn-reset" id="resetBtn" onclick="resetPortal()" style="display:none;">Start Over</button>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        let currentEmployee = null;
        let capturedPhoto = null;
        let videoStream = null;
        
        function showMessage(text, type = 'info') {
            const msg = document.getElementById('msgBox');
            msg.textContent = text;
            msg.className = `message show ${type}`;
            setTimeout(() => msg.classList.remove('show'), 5000);
        }
        
        function showLoading(show) {
            document.getElementById('loadingBox').className = show ? 'loading show' : 'loading';
        }
        
        async function handleCodeSubmit() {
            const code = document.getElementById('empCode').value.trim().toUpperCase();
            if (!code) {
                showMessage('❌ Please enter employee code', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch(`${API_BASE}/coordinator/api/search-employee`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee_code: code })
                });
                
                const data = await response.json();
                showLoading(false);
                
                if (data.success) {
                    currentEmployee = data.employee;
                    
                    // Display employee info
                    const initials = data.employee.full_name
                        .split(' ')
                        .map(n => n[0])
                        .join('')
                        .toUpperCase()
                        .slice(0, 2);
                    
                    document.getElementById('empAvatar').textContent = initials;
                    document.getElementById('empName').textContent = data.employee.full_name;
                    document.getElementById('empCode2').textContent = data.employee.employee_code;
                    document.getElementById('empDept').textContent = data.employee.department || 'N/A';
                    document.getElementById('empDesig').textContent = data.employee.designation || 'N/A';
                    
                    // Show employee info
                    document.getElementById('empInfo').classList.add('show');
                    document.getElementById('codeSection').style.opacity = '0.5';
                    document.getElementById('submitBtn').style.display = 'none';
                    
                    // Start camera and show camera section
                    startCamera();
                    document.getElementById('cameraSection').classList.add('show');
                    document.getElementById('actionButtons').style.display = 'flex';
                    document.getElementById('resetBtn').style.display = 'block';
                    
                    showMessage(`✅ Welcome ${data.employee.full_name}! Camera is ready.`, 'success');
                } else {
                    showMessage(`❌ ${data.error || 'Employee not found'}`, 'error');
                }
            } catch (error) {
                showLoading(false);
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
            })
                .then(stream => {
                    videoStream = stream;
                    document.getElementById('camera').srcObject = stream;
                })
                .catch(err => {
                    showMessage(`❌ Camera error: ${err.message}`, 'error');
                });
        }
        
        function capturePhoto() {
            const video = document.getElementById('camera');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            ctx.drawImage(video, 0, 0);
            
            capturedPhoto = canvas.toDataURL('image/jpeg', 0.95);
            document.getElementById('photoImg').src = capturedPhoto;
            document.getElementById('photoDisplay').style.display = 'block';
            
            // Hide camera, show photo
            video.style.display = 'none';
        }
        
        async function submitAttendance(action) {
            if (!currentEmployee) {
                showMessage('❌ No employee selected', 'error');
                return;
            }
            
            // Capture photo if not already captured
            if (!capturedPhoto) {
                capturePhoto();
            }
            
            showLoading(true);
            document.getElementById('actionButtons').style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/coordinator/api/submit-attendance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employee_id: currentEmployee.id,
                        action: action,
                        photo_base64: capturedPhoto,
                        latitude: 18.520430,
                        longitude: 73.856743
                    })
                });
                
                const data = await response.json();
                showLoading(false);
                
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                    setTimeout(() => resetPortal(), 2000);
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                    document.getElementById('actionButtons').style.display = 'flex';
                }
            } catch (error) {
                showLoading(false);
                showMessage(`❌ Error: ${error.message}`, 'error');
                document.getElementById('actionButtons').style.display = 'flex';
            }
        }
        
        function resetPortal() {
            // Stop camera
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
            }
            
            // Reset state
            currentEmployee = null;
            capturedPhoto = null;
            
            // Reset UI
            document.getElementById('empCode').value = '';
            document.getElementById('codeSection').style.opacity = '1';
            document.getElementById('empInfo').classList.remove('show');
            document.getElementById('cameraSection').classList.remove('show');
            document.getElementById('photoDisplay').style.display = 'none';
            document.getElementById('camera').style.display = 'block';
            document.getElementById('camera').srcObject = null;
            document.getElementById('actionButtons').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('msgBox').classList.remove('show');
            
            // Focus on input
            document.getElementById('empCode').focus();
        }
        
        // Handle Enter key on code input
        document.getElementById('empCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleCodeSubmit();
            }
        });
        
        // Auto-focus on load
        document.getElementById('empCode').focus();
    </script>
</body>
</html>
