<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator Login - Smart HRMS</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #4caf50;
            --danger: #f44336;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .card-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }
        
        .card-header p {
            font-size: 14px;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }
        
        .card-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-icon {
            position: absolute;
            left: 15px;
            font-size: 18px;
            color: var(--primary);
            z-index: 1;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }
        
        .form-group input::placeholder {
            color: #999;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(-1px);
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }
        
        .feature {
            text-align: center;
            padding: 15px;
        }
        
        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .feature-text {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .loading {
            display: none;
            text-align: center;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            padding: 20px 30px;
            background: #f9f9f9;
            color: #999;
            font-size: 12px;
        }
        
        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <!-- Header -->
            <div class="card-header">
                <div class="logo">👤</div>
                <h1>Coordinator Portal</h1>
                <p>Check-In/Check-Out System</p>
            </div>
            
            <!-- Body -->
            <div class="card-body">
                <div class="message" id="msgBox"></div>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <!-- Username -->
                    <div class="form-group">
                        <label for="username">👤 Username / Employee Code</label>
                        <div class="input-group">
                            <span class="input-icon">👤</span>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                required
                                autofocus
                            >
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">🔐 Password</label>
                        <div class="input-group">
                            <span class="input-icon">🔐</span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >
                        </div>
                    </div>
                    
                    <!-- Loading & Button -->
                    <div class="loading" id="loadingBox">
                        <div class="spinner"></div>
                        <p>Verifying credentials...</p>
                    </div>
                    
                    <button type="submit" class="login-btn" id="loginBtn">
                        🚀 Enter Portal
                    </button>
                </form>
                
                <!-- Features -->
                <div class="features">
                    <div class="feature">
                        <div class="feature-icon">📸</div>
                        <div class="feature-text">Photo Capture</div>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">⏱️</div>
                        <div class="feature-text">Real-Time</div>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">📱</div>
                        <div class="feature-text">GPS Tracking</div>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">✅</div>
                        <div class="feature-text">Verified Entry</div>
                    </div>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="footer">
                Smart HRMS © 2026 | <a href="/">Main Dashboard</a>
            </div>
        </div>
    </div>
    
    <script>
        function showMessage(text, type = 'info') {
            const msgBox = document.getElementById('msgBox');
            msgBox.textContent = text;
            msgBox.className = `message ${type}`;
            msgBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function clearMessage() {
            const msgBox = document.getElementById('msgBox');
            msgBox.classList.remove('success', 'error', 'info');
            msgBox.textContent = '';
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loadingBox = document.getElementById('loadingBox');
            
            if (!username || !password) {
                showMessage('❌ Please enter both username and password', 'error');
                return;
            }
            
            clearMessage();
            loadingBox.classList.add('active');
            loginBtn.disabled = true;
            
            try {
                const response = await fetch(window.location.origin + '/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
                    credentials: 'include'
                });
                
                // Check if login was successful
                if (response.ok || response.status === 302) {
                    // Check if we're authenticated
                    const checkResponse = await fetch(window.location.origin + '/coordinator/', {
                        credentials: 'include'
                    });
                    
                    if (checkResponse.ok) {
                        showMessage('✅ Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '/coordinator/';
                        }, 800);
                    } else if (checkResponse.status === 401 || checkResponse.status === 403) {
                        showMessage('❌ You do not have coordinator access', 'error');
                    } else {
                        window.location.href = '/coordinator/';
                    }
                } else {
                    const text = await response.text();
                    if (text.includes('Invalid username or password')) {
                        showMessage('❌ Invalid username or password', 'error');
                    } else {
                        showMessage('❌ Login failed. Please try again', 'error');
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('❌ Network error. Please check your connection', 'error');
            } finally {
                loadingBox.classList.remove('active');
                loginBtn.disabled = false;
            }
        }
        
        // Handle Enter key
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
