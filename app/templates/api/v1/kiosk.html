<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Kiosk — Smart HRMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .kiosk-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      overflow: hidden;
    }
    .kiosk-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px;
      text-align: center;
    }
    .kiosk-header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .kiosk-header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .step-indicator {
      display: flex;
      justify-content: space-between;
      padding: 20px 24px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
    }
    .step {
      text-align: center;
      flex: 1;
    }
    .step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e0e0e0;
      color: #666;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .step.active .step-number {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .step-label {
      font-size: 0.75rem;
      color: #999;
      font-weight: 500;
    }
    .step.active .step-label {
      color: #667eea;
      font-weight: 600;
    }
    
    .kiosk-content {
      padding: 32px 24px;
    }
    .step-panel {
      display: none;
    }
    .step-panel.active {
      display: block;
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .input-group {
      margin-bottom: 16px;
    }
    .input-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .employee-card {
      background: #f0f4ff;
      border: 2px solid #667eea;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .employee-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #667eea;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    .employee-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }
    .employee-info {
      font-size: 0.85rem;
      color: #666;
    }
    
    .camera-preview {
      width: 100%;
      background: #000;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .camera-preview.active {
      display: block;
    }
    video, canvas {
      width: 100%;
      border-radius: 8px;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    .btn-full {
      width: 100%;
    }
    
    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      border-left: 4px solid #f00;
      color: #c00;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    
    .success-message {
      background: #efe;
      border: 1px solid #cfc;
      border-left: 4px solid #0a0;
      color: #060;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
    }
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 4px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .check-buttons {
      display: flex;
      gap: 12px;
    }
    .check-buttons button {
      flex: 1;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .check-in {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }
    .check-in:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    .check-out {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
    }
    .check-out:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body>

<div class="kiosk-container">
  <!-- Header -->
  <div class="kiosk-header">
    <h1><i class="bi bi-clock-history"></i> Attendance Kiosk</h1>
    <p>Mark your attendance in 4 simple steps</p>
  </div>

  <!-- Step Indicator -->
  <div class="step-indicator">
    <div class="step active" id="step-indicator-1">
      <div class="step-number">1</div>
      <div class="step-label">Code</div>
    </div>
    <div class="step" id="step-indicator-2">
      <div class="step-number">2</div>
      <div class="step-label">Details</div>
    </div>
    <div class="step" id="step-indicator-3">
      <div class="step-number">3</div>
      <div class="step-label">Photo</div>
    </div>
    <div class="step" id="step-indicator-4">
      <div class="step-number">4</div>
      <div class="step-label">Submit</div>
    </div>
  </div>

  <!-- Content -->
  <div class="kiosk-content">
    <!-- STEP 1: Employee Code Entry -->
    <div class="step-panel active" id="panel-1">
      <h2 style="font-size:1.2rem;margin-bottom:16px">Step 1: Enter Employee Code</h2>
      <div class="input-group">
        <label class="input-label">Your Employee Code</label>
        <input type="text" id="employee-code" class="input-field" placeholder="e.g., E-2603025" autocomplete="off">
      </div>
      <div id="error-1" class="error-message" style="display:none"></div>
      <button class="btn btn-primary btn-full" onclick="nextStep(1)">
        <i class="bi bi-arrow-right"></i> Continue
      </button>
    </div>

    <!-- STEP 2: Employee Details Display -->
    <div class="step-panel" id="panel-2">
      <h2 style="font-size:1.2rem;margin-bottom:16px">Step 2: Verify Your Details</h2>
      <div id="loading-2" class="loading" style="display:none">
        <div class="spinner"></div>
        <p style="margin-top:12px;color:#666">Loading employee details...</p>
      </div>
      <div id="employee-display" style="display:none">
        <div class="employee-card">
          <div class="employee-avatar"><i class="bi bi-person-fill"></i></div>
          <div class="employee-name" id="emp-name"></div>
          <div class="employee-info" id="emp-dept"></div>
          <div class="employee-info" id="emp-desg"></div>
        </div>
      </div>
      <div id="error-2" class="error-message" style="display:none"></div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="prevStep(2)">
          <i class="bi bi-arrow-left"></i> Back
        </button>
        <button class="btn btn-primary" onclick="nextStep(2)">
          <i class="bi bi-camera"></i> Take Photo
        </button>
      </div>
    </div>

    <!-- STEP 3: Camera Photo Capture -->
    <div class="step-panel" id="panel-3">
      <h2 style="font-size:1.2rem;margin-bottom:16px">Step 3: Take Your Photo</h2>
      <video id="camera-preview" class="camera-preview active" autoplay playsinline></video>
      <canvas id="photo-canvas" style="display:none"></canvas>
      <div id="captured-photo" style="display:none">
        <img id="photo-preview" style="width:100%;border-radius:8px;margin-bottom:16px">
      </div>
      <div id="error-3" class="error-message" style="display:none"></div>
      <div class="btn-group" id="camera-buttons">
        <button class="btn btn-secondary" onclick="prevStep(3)">
          <i class="bi bi-arrow-left"></i> Back
        </button>
        <button class="btn btn-primary" onclick="capturePhoto()">
          <i class="bi bi-camera-fill"></i> Capture
        </button>
      </div>
      <div class="btn-group" id="retake-buttons" style="display:none">
        <button class="btn btn-secondary" onclick="retakePhoto()">
          <i class="bi bi-arrow-repeat"></i> Retake
        </button>
        <button class="btn btn-primary" onclick="nextStep(3)">
          <i class="bi bi-check"></i> Use Photo
        </button>
      </div>
    </div>

    <!-- STEP 4: Check In/Out Submission -->
    <div class="step-panel" id="panel-4">
      <h2 style="font-size:1.2rem;margin-bottom:16px">Step 4: Mark Attendance</h2>
      <div class="employee-card" style="margin-bottom:24px">
        <div style="font-size:0.9rem;color:#666;margin-bottom:8px">Submitting for:</div>
        <div class="employee-name" id="emp-name-4" style="font-size:1rem"></div>
      </div>
      <div id="success-4" class="success-message" style="display:none"></div>
      <div id="error-4" class="error-message" style="display:none"></div>
      <div class="check-buttons" id="check-buttons">
        <button class="check-in" onclick="submitAttendance('checkin')">
          <i class="bi bi-clock"></i><br>Check In
        </button>
        <button class="check-out" onclick="submitAttendance('checkout')">
          <i class="bi bi-clock"></i><br>Check Out
        </button>
      </div>
      <div id="submitting-4" style="display:none;text-align:center;padding:20px">
        <div class="spinner"></div>
        <p style="margin-top:12px;color:#666">Submitting attendance...</p>
      </div>
    </div>
  </div>
</div>

<script>
let currentStep = 1;
let employeeData = null;
let photoBase64 = null;

function updateStepIndicator() {
  for (let i = 1; i <= 4; i++) {
    const indicator = document.getElementById(`step-indicator-${i}`);
    indicator.classList.toggle('active', i === currentStep);
  }
}

function nextStep(step) {
  if (step === 1) {
    const code = document.getElementById('employee-code').value.trim().toUpperCase();
    if (!code) {
      showError(1, 'Please enter your employee code');
      return;
    }
    loadEmployee(code);
  } else if (step === 2) {
    startCamera();
    currentStep = 3;
    showPanel(3);
  } else if (step === 3) {
    currentStep = 4;
    showPanel(4);
    if (employeeData) {
      document.getElementById('emp-name-4').textContent = employeeData.name;
    }
  }
  updateStepIndicator();
}

function prevStep(step) {
  if (step === 2) {
    currentStep = 1;
  } else if (step === 3) {
    stopCamera();
    currentStep = 2;
  }
  showPanel(currentStep);
  updateStepIndicator();
}

function showPanel(panelNum) {
  for (let i = 1; i <= 4; i++) {
    const panel = document.getElementById(`panel-${i}`);
    panel.classList.toggle('active', i === panelNum);
  }
}

function showError(step, message) {
  const errorDiv = document.getElementById(`error-${step}`);
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
}

function clearError(step) {
  const errorDiv = document.getElementById(`error-${step}`);
  errorDiv.style.display = 'none';
}

async function loadEmployee(code) {
  clearError(1);
  const loading = document.getElementById('loading-2');
  const display = document.getElementById('employee-display');
  
  loading.style.display = 'block';
  display.style.display = 'none';
  
  try {
    const res = await fetch(`/api/v1/kiosk/employee?code=${encodeURIComponent(code)}`);
    const data = await res.json();
    
    if (data.success) {
      employeeData = data.employee;
      document.getElementById('emp-name').textContent = data.employee.name;
      document.getElementById('emp-dept').textContent = `Department: ${data.employee.department}`;
      document.getElementById('emp-desg').textContent = `Designation: ${data.employee.designation}`;
      
      loading.style.display = 'none';
      display.style.display = 'block';
      
      currentStep = 2;
      showPanel(2);
      updateStepIndicator();
    } else {
      showError(1, data.message || 'Employee not found');
      loading.style.display = 'none';
    }
  } catch (e) {
    showError(1, `Error: ${e.message}`);
    loading.style.display = 'none';
  }
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });
    const video = document.getElementById('camera-preview');
    video.srcObject = stream;
  } catch (e) {
    showError(3, `Camera error: ${e.message}`);
  }
}

function stopCamera() {
  const video = document.getElementById('camera-preview');
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
}

function capturePhoto() {
  const video = document.getElementById('camera-preview');
  const canvas = document.getElementById('photo-canvas');
  const ctx = canvas.getContext('2d');
  
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  
  photoBase64 = canvas.toDataURL('image/jpeg');
  
  const preview = document.getElementById('photo-preview');
  preview.src = photoBase64;
  
  document.getElementById('camera-preview').style.display = 'none';
  document.getElementById('captured-photo').style.display = 'block';
  document.getElementById('camera-buttons').style.display = 'none';
  document.getElementById('retake-buttons').style.display = 'flex';
}

function retakePhoto() {
  document.getElementById('captured-photo').style.display = 'none';
  document.getElementById('camera-preview').style.display = 'block';
  document.getElementById('camera-buttons').style.display = 'flex';
  document.getElementById('retake-buttons').style.display = 'none';
  photoBase64 = null;
}

async function submitAttendance(checkType) {
  if (!employeeData || !photoBase64) {
    showError(4, 'Missing employee or photo data');
    return;
  }
  
  document.getElementById('check-buttons').style.display = 'none';
  document.getElementById('submitting-4').style.display = 'block';
  clearError(4);
  
  try {
    const res = await fetch('/api/v1/kiosk/attendance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        employee_code: employeeData.code,
        check_type: checkType,
        latitude: 0,
        longitude: 0,
        accuracy: 100,
        photo_base64: photoBase64
      })
    });
    
    const data = await res.json();
    
    document.getElementById('submitting-4').style.display = 'none';
    
    if (data.success) {
      const successDiv = document.getElementById('success-4');
      successDiv.textContent = `✓ ${data.message}`;
      successDiv.style.display = 'block';
      document.getElementById('check-buttons').style.display = 'flex';
      
      setTimeout(() => {
        window.location.href = '/auth/login?tab=coordinator';
      }, 2000);
    } else {
      showError(4, data.message || 'Submission failed');
      document.getElementById('check-buttons').style.display = 'flex';
    }
  } catch (e) {
    showError(4, `Error: ${e.message}`);
    document.getElementById('check-buttons').style.display = 'flex';
    document.getElementById('submitting-4').style.display = 'none';
  }
}

// Auto-focus code field on load
window.addEventListener('load', () => {
  document.getElementById('employee-code').focus();
});
</script>

</body>
</html>
