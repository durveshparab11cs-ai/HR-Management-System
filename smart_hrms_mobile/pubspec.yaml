name: smart_hrms_mobile
description: Smart HRMS Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
  
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Network ───────────────────────────────────────────────
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # ── Local Storage ─────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── JSON Serialization ────────────────────────────────────
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # ── UI Components ─────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0
  flutter_staggered_animations: ^1.1.1
  badges: ^3.1.2

  # ── Camera & Image ────────────────────────────────────────
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.1.0
  uuid: ^4.0.0

  # ── Location / GPS ────────────────────────────────────────
  geolocator: ^12.0.0
  google_maps_flutter: ^2.7.0

  # ── Notifications ─────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.9.0

  # ── File & Documents ──────────────────────────────────────
  open_file: ^3.3.2
  path_provider: ^2.1.3
  intl: ^0.19.0

  # ── Biometrics ────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Utilities ─────────────────────────────────────────────
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  flutter_dotenv: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
